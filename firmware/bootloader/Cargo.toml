[package]
name = "bootloader"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bootloader"
path = "src/main.rs"

[dependencies]
hal = { path = "../hal" }
trickle = { path = "../trickle", default-features = false, features = ["impl-embassy"] }
proto = { path = "../proto", default-features = false, features = ["bl", "embassy"] }
qingke = { path = "../../../ch32-rs/qingke", version = "0.7" }
qingke-rt = { path = "../../../ch32-rs/qingke/qingke-rt", version = "0.7", features = ["v4"] }
embassy-executor = { version = "0.10.0", features = ["platform-spin", "executor-thread"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-sync = { version = "0.8" }
embassy-futures = "0.1"
static_cell = "2.1"
heapless = "0.9"

[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
lto = true
opt-level = "z"

[profile.dev]
strip = false
lto = true
opt-level = 2
