[package]
name = "kelp-firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
qingke-rt = { version = "0.7", features = ["v4"] }
qingke = { path = "../../ch32-rs/qingke", version = "0.7" }
ch32-metapac = { path = "../../ch32-rs/ch32-metapac", features = ["ch32v203c8u6", "rt", "memory-x"] }
riscv = "0.12"
critical-section = "1.2"
portable-atomic = { version = "1.9", features = ["critical-section"] }
fring = { version = "0.5", features = ["portable-atomic"] }
heapless = { version = "0.9" }

panic-halt = "1.0"

embassy-executor = { version = "0.10.0", features = [
    #"platform-riscv32", # WFI is acting up
    "platform-spin",
    "executor-thread",
] }
embassy-futures = "0.1.1"
embassy-sync = "0.7.0"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-time-driver = "0.2.0"
embassy-time-queue-utils = "0.3.0"

[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
lto = true
opt-level = "z" # Optimize for size.

[profile.dev]
strip = false
lto = true
opt-level = 1
