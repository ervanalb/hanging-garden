[package]
name = "kelp-firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
qingke-rt = "0.7"
qingke = { path = "../../ch32-rs/qingke" }
ch32-metapac = { path = "../../ch32-rs/ch32-metapac", features = ["ch32v203c8u6"] }
riscv = "0.12"
critical-section = "1.2"
portable-atomic = { version = "1.9", features = ["critical-section"] }

panic-halt = "1.0"

embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    "executor-thread",
] }
embassy-time = "0.5.1"
embassy-futures = "0.1.1"

[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
lto = true
opt-level = "z" # Optimize for size.

[profile.dev]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
lto = true
opt-level = "z" # Optimize for size.

[patch.crates-io]
qingke = { path = "../../ch32-rs/qingke" }
qingke-rt = { path = "../../ch32-rs/qingke/qingke-rt" }
